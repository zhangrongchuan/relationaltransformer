output_dir: ~/git/ULTRA/output

dataset:
  class: JointDataset
  graphs: [ICEWS14, ICEWS0515]
  root: ~/git/ULTRA/kg-datasets/

model:
  class: Ultra
  relation_model:
    class: NBFNet
    input_dim: 32
    hidden_dims: [32, 32, 32, 32, 32, 32]
    message_func: distmult
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes
    time_graph: default
    window_size: 0
  entity_model:
    class: IndNBFNet
    input_dim: 32
    hidden_dims: [32, 32, 32, 32, 32, 32]
    message_func: tcomplx
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes
    use_time: nbf_concat
    remove_edge: default
    boundary: default
    project_times: True
    time_dependent: False
    alpha: 0.8
    multi_hop: 3
  rule_model:
    class: Recurrency
    score_path: /Users/pjx/Documents/git/recurrency_baseline_tkg/results/baselinepsibaselinexi/baselinepsibaselinexi_ICEWS14_0.0_singlestep_0_-1_-1.pkl
    alpha: 0

task:
  name: MultiGraphPretraining
  num_negative: 512
  strict_negative: yes
  adversarial_temperature: 1
  metric: [mr, mrr, hits@1, hits@3, hits@10]

optimizer:
  class: AdamW
  lr: 5.0e-4

train:
  gpus: {{ gpus }}
  batch_size: 2
  num_epoch: 0
  log_interval: 800
  batch_per_epoch: 80000
  fast_test: 500
  #logger: wandb
